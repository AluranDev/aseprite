name: Compilar Aseprite Windows

on:
  workflow_dispatch: # Activa el botón Run workflow en GitHub

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - uses: aseprite/get-ninja@main

    - uses: TheMrMilchmann/setup-msvc-dev@v4
      with:
        arch: x64

    - name: Download Skia
      shell: bash
      run: |
        this_dir=$(cygpath "${{ github.workspace }}")
        skia_url=$(source $this_dir/laf/misc/skia-url.sh | xargs)
        skia_file=$(basename $skia_url)
        curl --ssl-revoke-best-effort -L -o "$skia_file" "$skia_url"
        unzip "$skia_file" -d skia

    - name: Generate Makefiles
      shell: bash
      run: |
        cmake -S . -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DENABLE_TESTS=OFF \
          -DENABLE_SCRIPTING=ON \
          -DLAF_BACKEND=skia \
          -DSKIA_DIR=$(realpath skia) \
          -DSKIA_LIBRARY_DIR=$(realpath skia/out/Release-x64)

    - name: Compile
      shell: bash
      run: |
        cd build && ninja aseprite

    - name: Create Bundle
      shell: bash
      run: |
        mkdir -p dist
        cp -r build/bin/* dist/

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Aseprite-Windows
        path: dist/
